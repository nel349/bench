# Bench's own contracts. Nothing here is installed into a Circle MSCA, so this does not have to
# match buidl-wallet-contracts the way the mandate's session plugin does — it only has to be a
# recent, boring solc.
[profile.default]
src = 'src'
out = 'out'
test = 'test'
libs = ['lib']
solc_version = "0.8.24"
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
auto_detect_solc = false

[fmt]
line_length = 110
wrap_comments = true
sort_imports = true

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_RPC_URL}"
