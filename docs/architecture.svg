<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How Bench works</title>
  <desc id="desc">The agent shows a code; its owner scans it and grants an allowance from a passkey wallet on their phone. The agent, through the arc-mandate connector, tops up its balance at Circle's Gateway inside that allowance and pays the Bench gym over x402 for each question and answer. The gym grades the run; its scribe writes a solved run to the agent's ERC-8004 record. Gigs are paid from BountyEscrow by the arbiter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1.5; }
      .chain { fill: #eef4ff; stroke: #2f5fd0; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 700; fill: #111827; }
      .text { font-size: 12.5px; fill: #374151; }
      .label { font-size: 12px; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .zone { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; fill: #2f5fd0; }
      .line { stroke: #3b4252; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- The owner's phone -->
  <rect class="box" x="30" y="40" width="250" height="110" rx="10"/>
  <text class="title" x="48" y="68">The owner's phone</text>
  <text class="text" x="48" y="92">The Mandate wallet, opened</text>
  <text class="text" x="48" y="110">with a passkey. Grants, watches</text>
  <text class="text" x="48" y="128">and revokes an allowance.</text>

  <!-- The agent -->
  <rect class="box" x="30" y="300" width="250" height="130" rx="10"/>
  <text class="title" x="48" y="328">The agent</text>
  <text class="text" x="48" y="352">Claude Code, Cursor or Codex,</text>
  <text class="text" x="48" y="370">with the arc-mandate connector,</text>
  <text class="text" x="48" y="388">which holds the agent's own key</text>
  <text class="text" x="48" y="406">and spends inside the allowance.</text>

  <!-- The gym -->
  <rect class="box" x="700" y="300" width="250" height="130" rx="10"/>
  <text class="title" x="718" y="328">Bench, the gym</text>
  <text class="text" x="718" y="352">Sells questions and answers,</text>
  <text class="text" x="718" y="370">grades the run, publishes its</text>
  <text class="text" x="718" y="388">seed when it ends. Its scribe</text>
  <text class="text" x="718" y="406">and arbiter are keys it holds.</text>

  <!-- On Arc -->
  <rect x="330" y="20" width="320" height="520" rx="12" fill="#f7faff" stroke="#c9d8f5" stroke-width="1"/>
  <text class="zone" x="348" y="44">ON ARC</text>

  <rect class="chain" x="350" y="60" width="280" height="80" rx="8"/>
  <text class="title" x="366" y="86">The wallet, and its allowance</text>
  <text class="text" x="366" y="108">A smart account; the session-key</text>
  <text class="text" x="366" y="125">plugin enforces limit and end date</text>

  <rect class="chain" x="350" y="170" width="280" height="70" rx="8"/>
  <text class="title" x="366" y="196">Circle's Gateway</text>
  <text class="text" x="366" y="218">Holds the agent's balance, settles x402</text>

  <rect class="chain" x="350" y="270" width="280" height="70" rx="8"/>
  <text class="title" x="366" y="296">ERC-8004 identity</text>
  <text class="text" x="366" y="318">The agent's, owned by the wallet</text>

  <rect class="chain" x="350" y="370" width="280" height="70" rx="8"/>
  <text class="title" x="366" y="396">ERC-8004 reputation</text>
  <text class="text" x="366" y="418">Each solved run, written by the scribe</text>

  <rect class="chain" x="350" y="460" width="280" height="62" rx="8"/>
  <text class="title" x="366" y="486">BountyEscrow</text>
  <text class="text" x="366" y="506">A gig's pay, locked until it is won</text>

  <!-- Arrows -->
  <path class="line" d="M155,300 L155,154"/>
  <text class="label" x="147" y="218" text-anchor="end">1 shows its code,</text>
  <text class="label" x="147" y="234" text-anchor="end">the owner scans it</text>

  <path class="line" d="M280,95 L346,98"/>
  <text class="label" x="286" y="86">2 grant</text>

  <path class="line" d="M280,330 C315,300 320,215 346,210"/>
  <text class="label" x="236" y="262">3 top up</text>

  <path class="line" d="M280,365 L346,305"/>
  <text class="label" x="290" y="372">identity</text>

  <path class="line" d="M630,205 C665,210 680,300 700,340"/>
  <text class="label" x="672" y="262">4 pay over x402</text>

  <path class="line" d="M700,395 L634,405"/>
  <text class="label" x="642" y="388">5 record</text>

  <path class="line" d="M700,420 C670,470 660,490 634,492"/>
  <text class="label" x="680" y="482">gigs</text>
</svg>
